# Спринт 20 follow-up (2026-11-20, решение Заказчика: VPN без участия хостера):
# главный конфиг nginx — SNI-мультиплекс на 443.
# TLS-трафик 443 читает SNI ДО терминирования (stream ssl_preread):
#   SNI www.microsoft.com  → xray (Reality-VPN, host :8443, контейнер 3x-ui)
#   всё остальное (домен школы / bare-IP / без SNI) → школьный https (внутр. 8443)
# HTTP 80 (redirect) остаётся в http-блоке. Desktop-веб школы не меняется:
# тот же терминирующий server, просто на внутреннем порту 8443 (наружу
# публикуется только 443 — compose не трогается по портам).
# Nginx: --with-stream + --with-stream_ssl_preread_module встроены (nginx:1.29-trixie).

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # 80 → HTTPS (по $host; для bare-IP уводим на тот же порт 443)
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Школьный https-терминатор — внутренний порт 8443 контейнера
    # (наружу не публикуется; наружу торчит только stream на 443)
    include /etc/nginx/conf.d/*.conf;
}

stream {
    map $ssl_preread_server_name $sni_route {
        www.microsoft.com xray_reality;
        default school_https;
    }

    upstream xray_reality {
        # xray работает на хосте (3x-ui, network=host) — порт 8443
        server host.docker.internal:8443;
    }

    upstream school_https {
        # школьный https-сервер в этом же nginx (http-блок, listen 8443)
        server 127.0.0.1:8443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $sni_route;
        proxy_connect_timeout 5s;
    }
}
