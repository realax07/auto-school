# Контейнерный эквивалент deploy/nginx-autoschool.conf (задача 2.1):
# proxy на app:8390 по внутренней сети, X-Forwarded-*.
# TLS-файлы монтируются из ${TLS_DIR} хоста в /etc/nginx/tls — в образ НЕ
# попадают (INC-006). server_name _ — принимаем любой Host (bare-metal
# вариант привязан к IP стенда; здесь терминируем всё, что дошло до контейнера).
#
# Спринт 20 follow-up (2026-11-20, add-instructor-mobile follow-up — VPN без
# участия хостера): школьный https-терминатор переведён с 443 на ВНУТРЕННИЙ
# порт 8443 контейнера; наружный 443 занял nginx stream-мультиплекс
# (deploy/container/nginx-main.conf): SNI www.microsoft.com → xray-Reality
# (host :8443), всё остальное → этот server. HTTP 80 → HTTPS остался в main.

server {
    listen 80;
    server_name _;

    # Весь HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;

    # Self-signed (решение Заказчика: ходим по IP, риски приняты)
    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    # Умеренные заголовки безопасности (эквивалент bare-metal конфига)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://app:8390;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
