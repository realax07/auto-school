# Контейнерный эквивалент deploy/nginx-autoschool.conf (задача 2.1):
# 80→443, proxy на app:8390 по внутренней сети, X-Forwarded-*.
# TLS-файлы монтируются из ${TLS_DIR} хоста в /etc/nginx/tls — в образ НЕ
# попадают (INC-006). server_name _ — принимаем любой Host (bare-metal
# вариант привязан к IP стенда; здесь терминируем всё, что дошло до контейнера).

server {
    listen 80;
    server_name _;

    # Весь HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Self-signed (решение Заказчика: ходим по IP, риски приняты)
    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    # Умеренные заголовки безопасности (эквивалент bare-metal конфига)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://app:8390;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
