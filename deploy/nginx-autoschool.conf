server {
    listen 80;
    server_name 206.245.133.15;

    # Весь HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 206.245.133.15;

    # Self-signed (решение Заказчика: ходим по IP, риски приняты)
    ssl_certificate     /home/hermes-bot/auto-school/deploy/tls/cert.pem;
    ssl_certificate_key /home/hermes-bot/auto-school/deploy/tls/key.pem;

    # Умеренные заголовки безопасности
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://127.0.0.1:8390;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
