<!doctype html>
<!-- Админка: вход по прямой ссылке (заглушка). Одна учетка: admin / admin -->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>СберАвтошкола — Админка</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020b13;color:#f7fbfa;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.hero{position:relative;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 500px at 30% 20%,rgba(20,90,60,.4),transparent 60%),#020b13}
.card{width:min(400px,100%);padding:40px 36px 32px;border:1px solid rgba(234,255,249,.16);border-radius:28px;background:linear-gradient(150deg,rgba(16,30,38,.94),rgba(9,22,28,.96));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 70px rgba(0,0,0,.5)}
h1{margin:0 0 6px;font-size:28px;font-weight:550;letter-spacing:-.02em}
p{margin:0 0 24px;font-size:14px;color:#a9bcc0}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:#b7c6ca;margin-bottom:7px}
.field input{width:100%;height:52px;padding:0 18px;border:1px solid rgba(230,250,248,.2);border-radius:16px;background:rgba(10,26,33,.7);color:#f2faf9;font-size:16px;outline:none}
.field input:focus{border-color:#49ec9a;box-shadow:0 0 0 3px rgba(73,236,154,.14)}
.btn{width:100%;height:54px;margin-top:10px;border:0;border-radius:999px;font-size:16px;font-weight:550;cursor:pointer;background:linear-gradient(95deg,#3fe58f,#2bd47e);color:#04241a}
.hint{margin:16px 0 0;font-size:12px;color:#7d939a;text-align:center}
.err{display:none;margin:0 0 14px;padding:10px 14px;border-radius:12px;background:rgba(255,99,99,.1);border:1px solid rgba(255,99,99,.3);color:#ff9c9c;font-size:13px}
.err.show{display:block}
</style></head><body>
<div class="hero"><div class="card">
  <h1>Админка</h1>
  <p>Вход только по прямой ссылке</p>
  <div class="err" id="err">Неверный логин или пароль</div>
  <form onsubmit="return doLogin(event)">
    <div class="field"><label>Логин</label><input id="login" type="text" autocomplete="username"></div>
    <div class="field"><label>Пароль</label><input id="pass" type="password" autocomplete="current-password"></div>
    <button class="btn">Войти</button>
  </form>
  <p class="hint">Демо-доступ спринта-0: admin / admin</p>
</div></div>
<script>
function doLogin(e){
  e.preventDefault();
  var l=document.getElementById('login').value.trim(), p=document.getElementById('pass').value;
  fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:l,password:p})})
    .then(function(r){return r.json().then(function(d){return {status:r.status,data:d}})})
    .then(function(res){
      if(res.status===200&&res.data.ok&&res.data.token){
        sessionStorage.setItem('admin_token',res.data.token);
        location.href='/admin-dashboard';
      }else{
        document.getElementById('err').classList.add('show');
      }
    })
    .catch(function(){document.getElementById('err').classList.add('show');});
  return false;
}
</script>
</body></html>
