<!doctype html>
<!-- «Политика персональных данных» — публичная страница /policy.
     Спринт 9 (change add-personal-data-policy, задача 2.1, FR-76).
     Оболочка БЕЗ текста политики: исходник страницы текста не содержит
     (NFR-25, grep-контроль) — при загрузке fetch GET /api/policy
     (backend/policy.py, артефакт deploy/policy/policy.md). Версия и дата
     — в шапке страницы; абзацы (разбиение текста по пустой строке) —
     ТЕКСТОВЫМИ УЗЛАМИ (textContent, НЕ innerHTML — XSS-гигиена).
     Ошибка API/сети → честное сообщение в контейнере текста (не пустая
     страница и не имитация текста). Вход не требуется: страница открыта
     гостям (механика / и /api/health). -->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071015"><title>Политика персональных данных — СберАвтошкола</title>
<style>
:root{--bg:#071015;--line:#ffffff16;--text:#f3f7f8;--muted:#93a6b1;--green:#35d879}
*{box-sizing:border-box}html,body{margin:0;min-width:320px}
body{background:radial-gradient(ellipse at 78% 0%,#123b2c4d,transparent 38%),radial-gradient(ellipse at 8% 90%,#27465f26,transparent 40%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}
.frame{max-width:760px;margin:auto;padding:26px 24px 46px}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}
.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:650;letter-spacing:-.03em;color:var(--text);text-decoration:none}
.check{width:26px;height:26px;flex:none;display:grid;place-items:center;border:3px solid #35d879;border-radius:50%;color:#35d879;font-size:16px;font-weight:500;transform:rotate(-8deg)}
.brand b{color:var(--green)}
.back{color:#bdc8ce;font-size:13px;text-decoration:none}
h1{font-size:clamp(26px,4vw,34px);letter-spacing:-.04em;font-weight:540;margin:30px 0 8px}
.meta{color:var(--muted);font-size:13px;margin:0 0 22px}
.policy-text{border-top:1px solid var(--line);padding-top:22px}
.policy-text p{white-space:pre-wrap;font-size:14px;line-height:1.75;color:#d7e1e6;margin:0 0 18px}
.policy-error{color:#ff9c9c;font-size:14px;line-height:1.6;margin:22px 0 0}
</style></head><body>
<div class="frame">
<header class="top"><a class="brand" href="/"><span class="check">✓</span><span><b>Сбер</b>Автошкола</span></a><a class="back" href="/">← Назад</a></header>
<h1>Политика персональных данных</h1>
<p class="meta" id="policy-meta"></p>
<div class="policy-text" id="policy-text"></div>
</div>
<script type="module" src="/js/policy.js"></script></body></html>
