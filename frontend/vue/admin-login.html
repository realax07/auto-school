<!doctype html>
<!-- Админка: вход по прямой ссылке (заглушка). Одна учетка: admin / admin
     Вход каркаса Vue (Спринт 15, change add-vue-s15-final-migration,
     задачи 1.1/2.1; ADR-008 — multi-entry MPA, НЕ SPA): разметка — дословный
     перенос frontend/admin-login.html (замена монолита целиком); легаси
     обслуживается до задачи 5.1 (design.md «Роуты и статика»). Стили —
     подключаемый css (дословный перенос <style> легаси); Vite бандлит его в
     /vue/assets с хэш-именем (CSS вне JS-бюджета NFR-26). До гидрации Vue
     видна эта же разметка; App.vue монтируется поверх #app (паттерн
     пилота/С11/С12/С14). Разметку держать синхронной с App.vue. -->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>СберАвтошкола — Админка</title>
<!-- Стили — дословный перенос <style> легаси (задача 2.1). -->
<link rel="stylesheet" href="/src/pages/admin-login/styles.css">
</head><body>
<div id="app">
<div class="hero"><div class="card">
  <h1>Админка</h1>
  <p>Вход только по прямой ссылке</p>
  <div class="err" id="err">Неверный логин или пароль</div>
  <form onsubmit="return doLogin(event)">
    <div class="field"><label>Логин</label><input id="login" type="text" autocomplete="username"></div>
    <div class="field"><label>Пароль</label><input id="pass" type="password" autocomplete="current-password"></div>
    <button class="btn">Войти</button>
  </form>
  <p class="hint">Демо-доступ спринта-0: admin / admin</p>
</div></div>
</div>
<script type="module" src="/src/pages/admin-login/main.js"></script></body></html>
