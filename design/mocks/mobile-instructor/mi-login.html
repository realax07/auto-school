<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — инструктор · мобайл</title><style>*{box-sizing:border-box}html,body{margin:0;background:#060b10;color:#e9eff1;font-family:Inter,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:390px;margin:0 auto;min-height:100vh;background:#060b10;position:relative;padding-bottom:64px}
.tb{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(6,11,16,.92);backdrop-filter:blur(12px)}
.tb .lg{font-size:14px;font-weight:700}.tb .lg em{font-style:normal;color:#34d399}
.tb .av{width:30px;height:30px;border-radius:50%;background:#123524;color:#34d399;display:grid;place-items:center;font-size:11px;font-weight:700;border:1px solid rgba(52,211,153,.35)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:390px;margin:0 auto;height:54px;background:rgba(8,14,20,.96);backdrop-filter:blur(14px);border-top:1px solid rgba(148,163,164,.12);display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#5b6b76;font-size:9px;font-weight:600;text-decoration:none;min-height:44px}
.tab svg{opacity:.85}.tab.on{color:#34d399}.tab.on svg{stroke:#34d399;filter:drop-shadow(0 0 6px rgba(52,211,153,.45))}
.pad{padding:14px 16px 0}
.h{font-size:20px;font-weight:750;letter-spacing:-.3px;margin:2px 0 12px}
.se{font-size:11px;font-weight:700;letter-spacing:.08em;color:#64748b;text-transform:uppercase;margin:20px 16px 10px}
.c{background:#0d151d;border:1px solid rgba(148,163,164,.1);border-radius:14px;padding:14px;margin-bottom:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;padding:13px;border:0;border-radius:12px;background:#10b981;color:#04211a;font-weight:700;font-size:14px;cursor:pointer}
.btn.gh{background:#13202b;color:#cbd5e1;border:1px solid rgba(148,163,164,.16)}
.btn.dn{background:#1a1216;color:#f87171;border:1px solid rgba(248,113,113,.35)}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700}
.pill.g{background:rgba(16,185,129,.14);color:#34d399}.pill.y{background:rgba(245,158,11,.13);color:#fbbf24}.pill.r{background:rgba(239,68,68,.12);color:#f87171}.pill.b{background:rgba(96,165,250,.13);color:#60a5fa}.pill.n{background:rgba(100,116,139,.15);color:#94a3b8}
.mt{color:#64748b;font-size:12px;line-height:1.45}
.row{display:flex;align-items:center;gap:12px}
input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(148,163,164,.16);background:#0d151d;color:#e9eff1;font-size:14px;outline:none;min-height:44px}
input:focus,textarea:focus{border-color:#10b981}
label{display:block;margin:14px 2px 6px;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(148,163,164,.07)}
.li:last-child{border-bottom:0;padding-bottom:0}
.av{flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:#13202b;display:grid;place-items:center;font-size:12px;font-weight:700;color:#94a3b8}
.li b{font-size:13.5px;font-weight:650}
.li .m{font-size:11.5px;color:#64748b;margin-top:2px}
.li .amt{margin-left:auto;font-weight:750;font-size:13.5px}
.up{color:#34d399}.dn{color:#f87171}.am{color:#fbbf24}
.st{margin-left:auto}
.big{font-size:34px;font-weight:800;letter-spacing:-.5px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#0d151d;border:1px solid rgba(148,163,164,.1);border-radius:14px;padding:12px}
.kpi .l{font-size:10px;font-weight:700;letter-spacing:.1em;color:#64748b;text-transform:uppercase}
.kpi .v{font-size:20px;font-weight:800;margin-top:5px}
.days{display:flex;gap:6px;padding:0 16px 12px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;border-radius:12px;background:#0d151d;border:1px solid rgba(148,163,164,.12);color:#94a3b8;min-height:56px;justify-content:center}
.day.on{background:rgba(16,185,129,.14);border-color:rgba(16,185,129,.45);color:#34d399}
.day b{font-size:13px}.day span{font-size:9.5px;font-weight:700;letter-spacing:.06em}
.two{display:flex;gap:10px}
.two .btn{flex:1}
.sheet-w{position:fixed;inset:0;z-index:80;background:rgba(3,7,11,.6);backdrop-filter:blur(10px);display:flex;align-items:flex-end}
.sheet{width:100%;max-width:390px;margin:0 auto;background:#0d151d;border-radius:18px 18px 0 0;padding:10px 18px 26px}
.grab{width:38px;height:4px;border-radius:4px;background:#2d3d49;margin:6px auto 12px}
.stars{display:flex;gap:6px}
.stars button{width:44px;height:44px;border:0;background:#0d151d;border-radius:10px;color:#fbbf24;font-size:20px;cursor:pointer}
.stars button.on{background:rgba(245,158,11,.14)}</style></head><body>
<div class="app">
<div class="tb"><div class="lg"><em>Сбер</em>Автошкола · инструктор</div><div class="av"></div></div>

<div class="pad" style="padding-top:34px">
  <div class="brand" style="display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;letter-spacing:-1px"><span style="width:36px;height:36px;display:grid;place-items:center;border:3px solid #10b981;border-radius:50%;color:#58efa3;font-size:22px;transform:rotate(-8deg)">✓</span><span><em style="font-style:normal;color:#55ed9c">Сбер</em>Автошкола</span></div>
  <div class="mt" style="margin:10px 2px 22px">Кабинет инструктора</div>
  <label>Телефон или email</label>
  <input placeholder="+7 ___ ___ __ __">
  <label>Пароль</label>
  <input type="password" placeholder="••••••••">
  <div style="height:16px"></div>
  <button class="btn">Войти</button>
  <div class="mt" style="margin-top:14px;text-align:center">Хотите стать инструктором? <b style="color:#55ed9c">Подайте заявку</b></div>
</div>

</div></body></html>
