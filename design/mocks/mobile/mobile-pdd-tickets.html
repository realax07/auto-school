<!doctype html>
<!-- Мокап мобильной версии (Спринт 18-дизайн, на согласование): Тренажер билетов.
     390px, тёмная тема, top-bar + чип-навигация, контент одноколоночный.
     Учётка/ФИО — в top-bar справа (инициалы); сайдбар desktop не дублируется — навигация чипами под top-bar. -->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тренажер билетов — мобайл</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#020b13;color:#f7fbfa;font-family:Inter,ui-sans-serif,-apple-system,"Segoe UI",sans-serif;font-size:14px}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#04101aee;backdrop-filter:blur(10px);border-bottom:1px solid rgba(217,239,238,.1)}
.brand{font-size:16px;font-weight:650;letter-spacing:-.5px}.brand em{font-style:normal;color:#55ed9c}
.ava{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#4af196,#06754d);display:grid;place-items:center;font-size:11px;font-weight:600;color:#04101a}
.chips{position:sticky;top:51px;z-index:49;display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#04101aee;backdrop-filter:blur(10px);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid rgba(227,247,245,.16);background:rgba(9,22,28,.9);color:#c9d6da;font-size:12px;white-space:nowrap}
.chip.on{background:#143023;color:#8ff2b5;border-color:#286445}
.wrap{padding:16px 14px 40px}
.kicker{font-size:10px;letter-spacing:.18em;color:#8fa3aa;text-transform:uppercase}
h1{margin:8px 0 6px;font-size:22px;font-weight:600;letter-spacing:-.02em}
.sub{color:#93a4ac;font-size:13px;line-height:1.5;margin:0 0 18px}
.card{padding:16px;border:1px solid rgba(221,249,245,.14);border-radius:16px;background:rgba(9,22,28,.92);margin-bottom:12px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:14px;background:#49ec9a;color:#04101a;font-weight:650;font-size:14px;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;border:1px solid rgba(234,255,249,.25);color:#dcebe9;font-weight:500}
.btn.danger{background:transparent;border:1px solid rgba(255,125,110,.5);color:#ff9d90}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px}
.pill.new{background:rgba(255,176,15,.15);color:#ffc46b}.pill.acc{background:rgba(73,236,154,.15);color:#55ed9c}.pill.den{background:rgba(255,125,110,.15);color:#ff9d90}
.muted{color:#8fa3aa;font-size:12px}
.row{display:flex;align-items:center;gap:10px}
input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(227,247,245,.18);background:rgba(9,22,28,.9);color:#f7fbfa;font-size:14px;outline:none}
label{display:block;margin:12px 0 6px;font-size:12px;color:#8fa3aa}
</style></head><body>
<div class="top"><div class="brand"><em>Сбер</em>Автошкола</div><div class="ava">ДС</div></div>
<div class="wrap">
  <div class="row" style="justify-content:space-between;margin-bottom:12px">
    <div class="kicker">Билет 1 · A/B/M</div>
    <div class="row" style="gap:8px"><span class="pill acc">⏱ 19:42</span><button class="pill den" style="border:0">Сбросить</button></div>
  </div>
  <div class="card" style="border-color:rgba(85,237,156,.35)">
    <div class="row" style="justify-content:space-between"><b style="font-size:15px">Вопрос 3 из 20</b><span class="muted">✅ 2 · ❌ 0</span></div>
    <p style="font-size:15px;font-weight:550">Можно ли Вам остановиться в указанном месте для посадки пассажира?</p>
    <img src="../../content/pdd/images/bilety/7995187s.jpg" style="width:100%;border-radius:12px;background:#fff">
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;padding:0 14px">
    <button class="btn" style="text-align:left;font-weight:500;background:rgba(73,236,154,.18);color:#c9f7df;border:1px solid #49ec9a">1. Можно. <span class="pill acc">Верный</span></button>
    <button class="btn" style="text-align:left;font-weight:500;background:rgba(255,125,110,.1);color:#ffd7d0;border:1px solid #ff7d6e">2. Можно, если Вы управляете такси.</button>
    <button class="btn" style="text-align:left;font-weight:500;background:rgba(255,255,255,.04);color:#c9d6da;border:1px solid rgba(227,247,245,.18)">3. Нельзя.</button>
  </div>
  <div style="padding:0 14px"><div class="card" style="background:#fff3df;border-color:#e8cf9e;margin:12px 0 0"><span style="color:#3d3427;font-size:13px;line-height:1.55"><b>Пояснение:</b> остановка для посадки разрешена в месте знака 5.16 — при отсутствии запрещающих условий.</span></div></div>
  <div class="wrap"><div class="row" style="flex-wrap:wrap;gap:6px">
    <span class="pill acc">1</span><span class="pill acc">2</span><span class="pill new">3</span><span class="pill">4</span><span class="pill">5</span><span class="pill">6</span><span class="pill">7</span><span class="pill">8</span><span class="pill">9</span><span class="pill">10</span><span class="pill">11</span><span class="pill">12</span><span class="pill">13</span><span class="pill">14</span><span class="pill">15</span><span class="pill">16</span><span class="pill">17</span><span class="pill">18</span><span class="pill">19</span><span class="pill">20</span>
  </div></div>
</div>
</body></html>
