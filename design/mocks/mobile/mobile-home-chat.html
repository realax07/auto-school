<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СберАвтошкола — Главная мобайл v2 (чат)</title>
<style>
  :root {
    --bg: #070c09;
    --green: #3ddc84;
    --green-dim: rgba(61, 220, 132, 0.16);
    --ink: #f2f5f3;
    --ink-muted: #9aa39d;
    --card-border: rgba(255, 255, 255, 0.07);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "SF Pro Display", -apple-system, "Segoe UI", Roboto, "DejaVu Sans", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .phone {
    width: 390px;
    height: 844px;
    background:
      radial-gradient(ellipse 500px 360px at 50% 42%, rgba(61,220,132,0.07) 0%, transparent 65%),
      var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  /* ---------- Header ---------- */
  .header {
    padding: 18px 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .logo { font-size: 24px; font-weight: 800; letter-spacing: -0.3px; }
  .logo .accent { color: var(--green); }
  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #0e1d15;
    border: 2px solid #234534;
    color: var(--green);
    font-weight: 700; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  /* ---------- Greeting (center) ---------- */
  .greeting {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 32px;
    gap: 20px;
  }
  .spark { width: 64px; height: 64px; }
  .hello {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  .hello-sub {
    font-size: 15px;
    color: var(--ink-muted);
    line-height: 1.5;
    max-width: 280px;
  }
  /* ---------- Input pinned to bottom ---------- */
  .composer {
    padding: 0 20px 16px;
  }
  .input-box {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 28px;
    padding: 18px 10px 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .input-box .placeholder {
    font-size: 16px;
    color: #8f9a93;
    line-height: 1.4;
    min-height: 24px;
    display: flex;
    align-items: flex-start;
  }
  .input-box .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .plus-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center;
  }
  .send {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--green);
    display: flex; align-items: center; justify-content: center;
  }
  /* ---------- Bottom nav ---------- */
  .tabbar {
    display: flex;
    justify-content: space-around;
    align-items: flex-start;
    padding: 12px 8px 26px;
    background: #0a100c;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: #7e8781;
    font-size: 11px;
    font-weight: 600;
    width: 64px;
  }
  .tab.active { color: var(--green); }
  .tab svg { width: 26px; height: 26px; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div class="header">
    <div class="logo"><span class="accent">Сбер</span>Автошкола</div>
    <div class="avatar">СМ</div>
  </div>

  <!-- Centered greeting -->
  <div class="greeting">
    <svg class="spark" viewBox="0 0 24 24" fill="none" stroke="#3ddc84" stroke-width="1.6" stroke-linecap="round">
      <path d="M12 2v6M12 16v6M2 12h6M16 12h6"/>
      <path d="M4.9 4.9l4.2 4.2M14.9 14.9l4.2 4.2M19.1 4.9l-4.2 4.2M9.1 14.9l-4.2 4.2"/>
    </svg>
    <div class="hello">Добрый день!</div>
    <div class="hello-sub">Спроси что угодно про обучение, экзамен или ПДД — помогу подготовиться</div>
  </div>

  <!-- Composer pinned to bottom -->
  <div class="composer">
    <div class="input-box">
      <div class="placeholder">Спроси что угодно про обучение, экзамен или ПДД...</div>
      <div class="actions">
        <div class="plus-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9aa39d" stroke-width="2" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </div>
        <div class="send">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a130e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5"/>
            <path d="M5 12l7-7 7 7"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom nav (unchanged) -->
  <div class="tabbar">
    <div class="tab active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5L12 3l9 7.5"/>
        <path d="M5 9.5V21h5v-6h4v6h5V9.5"/>
      </svg>
      Главная
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="5" width="16" height="16" rx="3"/>
        <path d="M4 10h16"/>
        <path d="M8 3v4M16 3v4"/>
      </svg>
      Записи
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15z"/>
        <path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/>
      </svg>
      Обучение
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="6" width="18" height="14" rx="3"/>
        <path d="M3 10h18"/>
        <path d="M7 15h4"/>
      </svg>
      Кошелек
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"/>
      </svg>
      Профиль
    </div>
  </div>

</div>
</body>
</html>
