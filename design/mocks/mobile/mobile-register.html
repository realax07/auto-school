<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Регистрация (bottom-sheet) — мобайл</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#060b10;color:#e9eff1;font-family:Inter,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:390px;margin:0 auto;min-height:100vh;background:#060b10;position:relative;padding-bottom:64px}
.tb{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(6,11,16,.92);backdrop-filter:blur(12px)}
.tb .lg{font-size:14px;font-weight:700}.tb .lg em{font-style:normal;color:#34d399}
.tb .av{width:30px;height:30px;border-radius:50%;background:#123524;color:#34d399;display:grid;place-items:center;font-size:11px;font-weight:700;border:1px solid rgba(52,211,153,.35)}
/* компактный таб-бар */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:390px;margin:0 auto;height:54px;background:rgba(8,14,20,.96);backdrop-filter:blur(14px);border-top:1px solid rgba(148,163,164,.12);display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#5b6b76;font-size:9px;font-weight:600;text-decoration:none}
.tab svg{opacity:.85}
.tab.on{color:#34d399}.tab.on svg{stroke:#34d399;filter:drop-shadow(0 0 6px rgba(52,211,153,.45))}
.pad{padding:14px 16px 0}
.h{font-size:20px;font-weight:750;letter-spacing:-.3px;margin:2px 0 12px}
.se{font-size:11px;font-weight:700;letter-spacing:.08em;color:#64748b;text-transform:uppercase;margin:20px 2px 10px}
.c{background:#0d151d;border:1px solid rgba(148,163,164,.1);border-radius:14px;padding:14px;margin-bottom:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:0;border-radius:12px;background:#10b981;color:#04211a;font-weight:700;font-size:14px;cursor:pointer}
.btn.gh{background:#13202b;color:#cbd5e1;border:1px solid rgba(148,163,164,.16)}
.btn.dn{background:#1a1216;color:#f87171;border:1px solid rgba(248,113,113,.35)}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700}
.pill.g{background:rgba(16,185,129,.14);color:#34d399}.pill.y{background:rgba(245,158,11,.13);color:#fbbf24}.pill.r{background:rgba(239,68,68,.12);color:#f87171}.pill.b{background:rgba(96,165,250,.13);color:#60a5fa}.pill.n{background:rgba(100,116,139,.15);color:#94a3b8}
.mt{color:#64748b;font-size:12px;line-height:1.45}
.row{display:flex;align-items:center;gap:12px}
input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(148,163,164,.16);background:#0d151d;color:#e9eff1;font-size:14px;outline:none}
input:focus{border-color:#10b981}
label{display:block;margin:14px 2px 6px;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em}
.search{display:flex;align-items:center;gap:10px;background:#0d151d;border:1px solid rgba(148,163,164,.14);border-radius:12px;padding:11px 14px;margin:0 16px 14px;color:#64748b;font-size:13.5px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:10px;background:#0d151d;border:1px solid rgba(148,163,164,.14);color:#94a3b8;font-size:12px;font-weight:600;white-space:nowrap}
.chip.on{background:rgba(16,185,129,.14);color:#34d399;border-color:rgba(16,185,129,.4)}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(148,163,164,.07)}
.li:last-child{border-bottom:0;padding-bottom:0}
.av{flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:#13202b;display:grid;place-items:center;font-size:12px;font-weight:700;color:#94a3b8}
.li b{font-size:13.5px;font-weight:650}
.li .m{font-size:11.5px;color:#64748b;margin-top:2px}
.li .amt{margin-left:auto;font-weight:750;font-size:13.5px}
.up{color:#34d399}.dn{color:#f87171}.am{color:#fbbf24}
.st{margin-left:auto}
.fab{position:fixed;right:16px;bottom:76px;width:52px;height:52px;border-radius:16px;background:#10b981;display:grid;place-items:center;box-shadow:0 10px 26px rgba(16,185,129,.35);z-index:30}
.sheet-w{position:fixed;inset:0;z-index:80;background:rgba(3,7,11,.6);backdrop-filter:blur(10px);display:flex;align-items:flex-end}
.sheet{width:100%;max-width:390px;margin:0 auto;background:#0d151d;border-radius:18px 18px 0 0;padding:10px 18px 26px}
.grab{width:38px;height:4px;border-radius:4px;background:#2d3d49;margin:6px auto 12px}
.sh-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sh-t b{font-size:16px;font-weight:750}
.x{width:28px;height:28px;border-radius:50%;background:#1a2631;color:#94a3b8;display:grid;place-items:center;font-size:13px}
.week{display:flex;gap:6px;margin:0 0 12px}
.day{flex:1;text-align:center;padding:8px 0 7px;border-radius:10px;background:#0d151d}
.day .d{font-size:9px;color:#64748b;text-transform:uppercase}
.day .n{font-size:15px;font-weight:700;margin-top:2px}
.day.on{background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.4)}
.day.on .d{color:#34d399}
.slot{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:12px;margin-bottom:7px;font-size:12.5px;font-weight:650}
.slot.f{background:rgba(16,185,129,.1);color:#a7f3d0}
.slot.b{background:#111a22;color:#52606d;text-decoration:line-through}
.slot.m{background:rgba(251,191,36,.08);color:#fcd34d}
.zgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.zc{background:#fff;border-radius:14px;padding:10px 8px;text-align:center}
.zc img{height:56px;object-fit:contain}
.zc b{display:block;font-size:11.5px;color:#0b131c;margin-top:6px}
.zc .n{font-size:10.5px;color:#52606d;line-height:1.3;margin-top:2px}
.sh{position:fixed;inset:0;z-index:80;background:rgba(3,7,11,.6);backdrop-filter:blur(10px);display:flex;align-items:flex-end}
.shb{width:100%;max-width:390px;margin:0 auto;background:#0d151d;border-radius:18px 18px 0 0;padding:10px 18px 26px}
.grab{width:38px;height:4px;border-radius:4px;background:#2d3d49;margin:6px auto 12px}
.sh-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sh-t b{font-size:16px;font-weight:750}
.x{width:28px;height:28px;border-radius:50%;background:#1a2631;color:#94a3b8;display:grid;place-items:center;font-size:13px}
.qimg{width:100%;border-radius:14px;background:#fff;display:block;margin:12px 0}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;padding:13px 14px;border-radius:12px;border:1px solid rgba(148,163,164,.16);background:#0d151d;color:#dbe4ea;font-size:13.5px;line-height:1.45;margin-bottom:8px}
.opt .k{flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:rgba(148,163,164,.14);display:grid;place-items:center;font-size:11px;font-weight:700}
.opt.g{border-color:rgba(16,185,129,.55);background:rgba(16,185,129,.08)}
.opt.g .k{background:#10b981;color:#04211a}
.opt.b2{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.06)}
.opt.b2 .k{background:#ef4444;color:#fff}
.expl{background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.22);border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.5;color:#9db8ad;margin-top:2px}
.expl b{color:#34d399}
.qnav{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:14px}
.qn{height:32px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;background:#0d151d;color:#52606d}
.qn.g{background:rgba(16,185,129,.16);color:#34d399}
.qn.cur{outline:2px solid #10b981;color:#e9eff1}
.bal{background:linear-gradient(140deg,#0d2b21,#0b1a24 60%,#0d1f2d);border:1px solid rgba(16,185,129,.28);border-radius:18px;padding:18px}
.bal .l{font-size:10px;font-weight:700;letter-spacing:.12em;color:#6ee7b7}
.bal .v{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:6px 0 10px}
.bal .p{display:flex;gap:6px}
.fine-c{background:#0d151d;border:1px solid rgba(148,163,164,.14);border-radius:14px;padding:14px;margin-top:10px}
</style></head><body>
<div class="app">
<div class="tb"><div class="lg"><em>Сбер</em>Автошкола</div><div class="av">ДС</div></div>

<div class="pad"><div class="h">Кабинет</div></div>
<div class="shb">
  <div class="grab"></div>
  <div class="sh-t"><b>Регистрация</b><span class="x"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="None" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div>
  <label>Фамилия</label><input placeholder="Иванов">
  <label>Имя</label><input placeholder="Иван">
  <label>Отчество</label><input placeholder="Иванович">
  <label>Email</label><input placeholder="you@mail.ru">
  <label>Телефон</label><input placeholder="+7 900 000-00-00">
  <label>Пароль</label><input type="password" placeholder="••••••••">
  <label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" style="width:auto;margin-top:2px"><span style="font-size:11.5px;color:#9db0a8">Согласен с <span style="color:#34d399">политикой ПД</span> и обработкой персональных данных</span></label>
  <button class="btn" style="margin-top:14px">Создать аккаунт</button>
  <div class="mt" style="text-align:center;margin-top:10px">Уже есть аккаунт? <span style="color:#34d399">Войти</span></div>
</div>


</div></body></html>
