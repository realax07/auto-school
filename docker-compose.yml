# Compose-стек auto-school (ADR-006, задача 2.1; Спринт 16, add-wallet-economy
# 16.0 — стек сокращен до двух сервисов app + nginx по решению Заказчика
# 2026-11-14 об удалении S3-хранилища (дословная цитата — в дельте
# specs/containerization и статусной приписке ADR-006): состояние загрузок —
# на volume uploads, история Спринта 6 сохранена в ADR-006).
# Наружу публикуются только 80/443 nginx; app (8390) — без публикуемых
# портов, доступен только внутри сети frontend (NFR-16, MIN-1). Секреты —
# env_file .env (вне git, вне образов, INC-006); состояние — named volumes.
# Файл без deprecated `version:` ключа (compose spec v2).

name: autoschool

services:
  app:
    build: .
    image: autoschool:local
    env_file: .env
    environment:
      # Спринт 10 (задача 4.1, MIN-2 арх-ревью-002): TZ закреплена и в
      # compose — единая точка с образом (ENV TZ Dockerfile): локальное
      # время контейнера = МСК; материализация легаси-пути брони без date
      # корректна в окне 21:00–24:00 UTC.
      TZ: Europe/Moscow
      AUTOSCHOOL_DB_PATH: /data/db/app.db
      AUTOSCHOOL_UPLOADS_DIR: /data/uploads
      # Спринт 9 (add-personal-data-policy, задача 6.1): артефакт политики
      # НЕ в образе — bind-mount каталога хоста (read-only), значение
      # POLICY_FILE согласовано с точкой монтирования (design.md
      # «Deploy-контур»). Подмена = замена файла на хосте + рестарт app
      # (см. deploy/RUNBOOK.md «Подмена политики»), без пересборки образа.
      POLICY_FILE: /app/deploy/policy/policy.md
      # Волна 19.7: прямой внешний инференс GLM — отдельный сервис
      # ai-bridge (ключ в его конфиге, монтируемом :ro и gitignored;
      # в app ключа нет). AI_PROVIDER_URL ниже.
      AI_PROVIDER_URL: http://ai-bridge:8790/chat
    volumes:
      - db:/data/db
      - uploads:/data/uploads
      # Каталог хоста можно переопределить (POLICY_DIR в .env); дефолт —
      # артефакт репозитория deploy/policy (волна 1, задача 1.1).
      - ${POLICY_DIR:-./deploy/policy}:/app/deploy/policy:ro
    # Порты НЕ публикуются — nginx ходит по внутренней сети frontend
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8390/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  nginx:
    # pinned образ (ADR-006 п.2: pin tag+digest)
    image: nginx:1.29-trixie@sha256:1881968aff6f7cdcc4b888c00a11f4ce241ad7ec957e0cb4a9e19e93a3ff87ea
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Конфиг и TLS — монтирования, НЕ в образе (INC-006, NFR-14).
      # TLS_DIR задается в .env (каталог на хосте, по умолчанию ./deploy/tls)
      - ./deploy/container/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:-./deploy/tls}:/etc/nginx/tls:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
    restart: unless-stopped

  # Волна 19.7: AI-мост «ГигаЧат» v2 — GLM chat-completions (модель строго
  # glm-5.3-flash — решение Заказчика) + RAG-lite по канону content/pdd.
  # Отдельный сервис с КОНФИГОМ: ключ/модель/base-url — в ai-bridge.json
  # (gitignored каталог ai-bridge-config/, монтируется :ro; в репо ключа
  # нет). Сервис без ports — только внутренняя сеть frontend.
  ai-bridge:
    build: ./services/ai-bridge
    environment:
      AI_BRIDGE_CONFIG: /app/config/ai-bridge.json
    volumes:
      - ${AI_BRIDGE_CONFIG_DIR:-./ai-bridge-config}/ai-bridge.json:/app/config/ai-bridge.json:ro
      - ./content/pdd:/app/content/pdd:ro
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend:
    # MAJ-1 (review-19.6-001): pin subnet+gateway — контейнер бэкенда ходит
    # в ai-bridge; пересоздание сети станет fail-loud при `docker compose
    # up`, а не молчаливой деградацией чата. Конфликт с существующей сетью
    # решается `docker network rm` перед up (сети проекта принадлежат compose).
    ipam:
      config:
        - subnet: 172.19.0.0/24
          gateway: 172.19.0.1

volumes:
  db:
  uploads:
